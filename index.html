let O={step:0,f:[],d:{},done:false};
const OS=['Business','Digital presence','Materials','Challenges','Submit'];
const OF=[[['company','Company name','t',1],['website','Website URL','t',1],['industry','Industry','s:Technology,Food & Beverage,Health,Finance,Professional Services'],['size','Company size','s:1-10,11-50,51-200,200+'],['contact','Primary contact','t',1],['desc','Business description','a'],['audience','Target audience','a']],[['web','Website URL','t'],['lico','LinkedIn company page','t'],['lifo','LinkedIn founder profile','t'],['social','Social media profiles','t'],['other','Other marketing channels','t']],[],[['q1','What feels inconsistent about your brand?','a',1],['q2','Which materials need attention?','a'],['q3','What prompted this assessment?','a'],['q4','What would a successful review look like?','a']]];
function addF(n){const o={n,t:(n.split('.').pop()||'file').toUpperCase().slice(0,5),st:'Uploading'};O.f.push(o);setTimeout(()=>{o.st='Submitted';if(page=='Focal Point Reviews'&&O.step==2)render()},1300);render()}
function upf(l){[...l].forEach(f=>addF(f.name))}
function onx(){const miss=OF[O.step].filter(f=>f[3]&&!(O.d[f[0]]||'').trim());if(miss.length){toast('Please complete: '+miss.map(m=>m[1]).join(', '));return}if(O.step==2&&!O.f.length){toast('Upload at least one brand asset to continue');return}O.step++;render()}
function osub(){O.done=true;P.unshift({n:O.d.contact,co:O.d.company,t:'Focal Point Review',s:2,d:'Today',p:15,iso:'2026-11-25'});ACT.unshift(['ED',O.d.company+' completed onboarding with '+O.f.length+' assets','Just now']);NOTI.unshift('New submission from '+O.d.company);notif();$('#dot').style.display='block';toast('Onboarding submitted. Consultant notified.');render()}
function onb(){if(O.done)return `<div class="wrap"><div class="card empty"><h1>Thank you, ${O.d.contact}</h1><p>Your brand information and ${O.f.length} files have been submitted. Eric will begin your review and reach out to schedule a kickoff.</p><button class="btn p" onclick="go('Overview')">See it on the consultant dashboard</button></div></div>`;
const s=O.step;let body='';if(s<4&&s!=2)body=OF[s].map(f=>`<label style="display:block;font-size:12.5px;color:var(--mut);margin:12px 0 4px">${f[1]}${f[3]?' *':''}</label>${f[2]=='a'?`<textarea rows="3" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit;color:inherit" oninput="O.d.${f[0]}=this.value">${O.d[f[0]]||''}</textarea>`:f[2][0]=='s'?`<select style="width:100%" onchange="O.d.${f[0]}=this.value">${f[2].slice(2).split(',').map(o=>`<option ${O.d[f[0]]==o?'selected':''}>${o}</option>`).join('')}</select>`:`<input style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px" value="${(O.d[f[0]]||'').replace(/"/g,'&quot;')}" oninput="O.d.${f[0]}=this.value">`}`).join('');
if(s==2)body=`<div style="border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;margin-top:12px;background:var(--bg)" ondragover="event.preventDefault()" ondrop="event.preventDefault();upf(event.dataTransfer.files)"><p style="margin:0 0 10px">Drag files here, or choose them below. Prototype only, nothing is uploaded.</p><input type="file" multiple id="fi" style="display:none" onchange="upf(this.files)"><button class="btn" onclick="fi.click()">Choose files</button> <button class="btn" onclick="['Brand-guidelines.pdf','Logo-pack.zip','Brochure-2024.pdf'].forEach(addF)">Add sample files</button></div>${O.f.map(f=>`<div class="li"><span class="tag">${f.t}</span><div style="flex:1"><b>${f.n}</b><div class="bar"><i data-w="100" style="transition-duration:1.2s"></i></div></div><span class="tag ${f.st=='Submitted'?'o':'i'}">${f.st}</span></div>`).join('')}`;
if(s==4)body=`<div style="margin-top:10px">${[['Company',O.d.company],['Website',O.d.website],['Contact',O.d.contact],['Files',O.f.length+' uploaded'],['Main concern',O.d.q1]].map(r=>`<div class="li"><small style="width:100px">${r[0]}</small><b>${r[1]||'\u2014'}</b></div>`).join('')}</div>`;
return `<div class="wrap" style="max-width:720px"><h1>Start Your Brand Review</h1><p class="sub">Share your brand information and marketing materials to begin your assessment. <span class="tag">Prototype</span></p><div style="display:flex;gap:6px;margin-bottom:16px">${OS.map((n,i)=>`<div style="flex:1"><div class="bar"><i style="width:${i<=s?100:0}%"></i></div><small style="color:${i==s?'var(--blue)':'var(--mut)'}">${i+1}. ${n}</small></div>`).join('')}</div><div class="card">${body}<div style="display:flex;justify-content:space-between;margin-top:18px"><button class="btn" ${s?'':'disabled style="opacity:.4"'} onclick="O.step--;render()">Back</button>${s<4?`<button class="btn p" onclick="onx()">Continue</button>`:`<button class="btn p" onclick="osub()">Submit for review</button>`}</div></div></div>`}
